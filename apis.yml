aid: alyce
name: Alyce
description: >-
  Alyce is an AI-powered corporate gifting platform that enables B2B sales,
  marketing, and customer success teams to send hyper-personalized gifts at
  scale. The platform provides a REST API for sending personalized gifts,
  tracking gift acceptance and engagement, managing budgets and marketplaces,
  and integrating with CRM and marketing automation tools including Salesforce,
  HubSpot, Marketo, Eloqua, Outreach, and Salesloft. Alyce, Inc. was acquired by
  Sendoso in February 2024 and operated as "Alyce by Sendoso"; the standalone Alyce
  product surface has since been decommissioned — as of August 2026 the alyce.com
  apex and every product subdomain (www, app, api, docs, dashboard, recipient) no
  longer resolve, the documentation host returns a Cloudflare origin error, and the
  status page is inactive. This profile is retained as a historical record.
