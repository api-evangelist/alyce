    name: Alyce API
    description: >-
      REST API for the Alyce corporate gifting platform enabling programmatic
      gift sending, recipient tracking, budget management, marketplace
      configuration, and CRM workflow automation. Supports integrations with
      Salesforce, HubSpot, Marketo, Eloqua, Outreach, and Salesloft.
    humanURL: https://help.alyce.com/collection/357-integrations
    baseURL: https://app.alyce.com/api
    tags:
      - Gifting
      - Corporate Gifting
      - B2B
      - Marketing Automation
      - CRM
    x-status: retired
    x-note: >-
      humanURL and baseURL are retained as the historical record of where the Alyce API
      and its integration documentation lived. Both hosts were re-probed on 2026-08-13:
      app.alyce.com returns NXDOMAIN and help.alyce.com returns Cloudflare error 525.
      The former "OpenAPI" property pointed at the API base URL, not at a specification
      document, and has been removed as false credit — Alyce never published a
      machine-readable contract at a reachable URL. See lifecycle/alyce-lifecycle.yml.
