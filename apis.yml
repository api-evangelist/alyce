aid: alyce
name: Alyce
description: >-
  Alyce is an AI-powered corporate gifting platform that enables B2B sales,
  marketing, and customer success teams to send hyper-personalized gifts at
  scale. The platform provides a REST API for sending personalized gifts,
  tracking gift acceptance and engagement, managing budgets and marketplaces,
  and integrating with CRM and marketing automation tools including Salesforce,
  HubSpot, Marketo, Eloqua, Outreach, and Salesloft.
