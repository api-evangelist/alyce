      status: 0
      detail: NXDOMAIN
      was: common[].type Website
    - url: https://www.alyce.com/blog/
      status: 0
      detail: NXDOMAIN
      was: common[].type Blog
      action: pointer removed
    - url: https://www.alyce.com/product/
      status: 0
      detail: NXDOMAIN
      was: common[].type Pricing
      action: pointer removed
    - url: https://app.alyce.com/api
